# Throwaway workflow for the Sentora json-render pilot: builds the slackbotv2
# image for linux/amd64 from a given ref with the repository Dockerfile and
# uploads it as a `docker save` tarball, so a node without registry access can
# `ctr images import` it. Lives only on the pilot/genui-image-build branch of
# the fork; it is not part of the upstream change.
name: Pilot slackbotv2 image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag or sha)
        required: true
        default: feat/slackbotv2-json-render

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Derive tag
        id: tag
        run: |
          short="$(git rev-parse --short=8 HEAD)"
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "image=centaur-slackbotv2:genui-${short}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build slackbotv2 image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/slackbotv2/Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.image }}
          outputs: type=docker,dest=/tmp/centaur-slackbotv2.tar
          build-args: |
            COMMIT_SHA=${{ github.sha }}

      - name: Compress
        run: gzip -1 /tmp/centaur-slackbotv2.tar && ls -la /tmp/centaur-slackbotv2.tar.gz

      - name: Upload image tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: centaur-slackbotv2-genui-${{ steps.tag.outputs.short }}
          path: /tmp/centaur-slackbotv2.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
